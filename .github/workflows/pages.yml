# Tests and publishes the static site in site/ to GitHub Pages on every push to main.
# The pipeline is not run here: it needs the licensed GRID data, which is never in this
# repository. The committed web/public/demo-pack.json holds aggregates only.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - run: npm run test:py
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  # Deploy in its own job (GitHub's starter layout), so the artifact is registered before it is read.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
